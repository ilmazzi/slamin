<VirtualHost *:80>
    ServerName slamin.local
    DocumentRoot "C:/xampp/htdocs/slamin/public"
    <Directory "C:/xampp/htdocs/slamin/public">
        AllowOverride All
        Require all granted
    </Directory>

    # Reverse proxy per Reverb WebSocket
    ProxyPreserveHost On
    ProxyPass /apps/ http://127.0.0.1:8080/apps/
    ProxyPassReverse /apps/ http://127.0.0.1:8080/apps/

    # Abilita WebSocket
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8080/$1" [P,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName slamin.local
    DocumentRoot "C:/xampp/htdocs/slamin/public"

    SSLEngine on
    SSLCertificateFile "C:/xampp/apache/conf/ssl/server.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl/server_no_pass.key"

    <Directory "C:/xampp/htdocs/slamin/public">
        AllowOverride All
        Require all granted
    </Directory>

    # Reverse proxy per Reverb WebSocket
    ProxyPreserveHost On
    ProxyPass /apps/ http://127.0.0.1:8080/apps/
    ProxyPassReverse /apps/ http://127.0.0.1:8080/apps/

    # Abilita WebSocket
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8080/$1" [P,L]
</VirtualHost>
