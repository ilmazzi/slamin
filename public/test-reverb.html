<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Laravel Reverb</title>
    <meta name="csrf-token" content="test-token">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #log { background: #f8f9fa; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🧪 Test Laravel Reverb</h1>
    
    <div id="status" class="status info">Inizializzazione...</div>
    
    <div>
        <button onclick="testEcho()">Test Laravel Echo</button>
        <button onclick="testReverbClient()">Test ReverbClient</button>
        <button onclick="testWebRTC()">Test WebRTC</button>
        <button onclick="clearLog()">Pulisci Log</button>
    </div>
    
    <div id="log"></div>

    <!-- Laravel Echo (compilato) -->
    <script src="/build/assets/app-BhHB14Sa.js"></script>
    
    <!-- Reverb Client -->
    <script src="/assets/js/reverb-client.js"></script>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function testEcho() {
            log('🧪 Test Laravel Echo...');
            
            try {
                if (typeof window.Echo === 'undefined') {
                    throw new Error('Laravel Echo non è definito');
                }
                
                log('✅ Laravel Echo è disponibile');
                log('✅ Echo configurato:', window.Echo);
                
                // Test canale pubblico
                window.Echo.channel('test-channel')
                    .listen('.test-event', (e) => {
                        log('📡 Evento ricevuto: ' + JSON.stringify(e));
                    });
                
                log('✅ Canale test configurato');
                
            } catch (error) {
                log('❌ Errore Laravel Echo: ' + error.message, 'error');
                updateStatus('Errore Laravel Echo', 'error');
            }
        }

        function testReverbClient() {
            log('🧪 Test ReverbClient...');
            
            try {
                if (typeof ReverbClient === 'undefined') {
                    throw new Error('ReverbClient non è definito');
                }
                
                log('✅ ReverbClient è disponibile');
                
                const client = new ReverbClient();
                log('✅ Istanza ReverbClient creata');
                
                // Test metodi
                if (typeof client.connect === 'function') {
                    log('✅ Metodo connect disponibile');
                }
                
                if (typeof client.isWebRTCSupported === 'function') {
                    log('✅ Metodo isWebRTCSupported disponibile');
                    log('WebRTC supportato: ' + client.isWebRTCSupported());
                }
                
                if (typeof client.isAudioCallSupported === 'function') {
                    log('✅ Metodo isAudioCallSupported disponibile');
                }
                
                if (typeof client.isVideoCallSupported === 'function') {
                    log('✅ Metodo isVideoCallSupported disponibile');
                }
                
                updateStatus('ReverbClient funziona correttamente', 'success');
                
            } catch (error) {
                log('❌ Errore ReverbClient: ' + error.message, 'error');
                updateStatus('Errore ReverbClient', 'error');
            }
        }

        function testWebRTC() {
            log('🧪 Test WebRTC...');
            
            try {
                if (!navigator.mediaDevices) {
                    throw new Error('navigator.mediaDevices non disponibile');
                }
                
                log('✅ navigator.mediaDevices disponibile');
                
                if (!navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia non disponibile');
                }
                
                log('✅ getUserMedia disponibile');
                
                // Test RTCPeerConnection
                if (typeof RTCPeerConnection === 'undefined') {
                    throw new Error('RTCPeerConnection non disponibile');
                }
                
                log('✅ RTCPeerConnection disponibile');
                
                const pc = new RTCPeerConnection();
                log('✅ Istanza RTCPeerConnection creata');
                
                updateStatus('WebRTC supportato correttamente', 'success');
                
            } catch (error) {
                log('❌ Errore WebRTC: ' + error.message, 'error');
                updateStatus('WebRTC non supportato', 'error');
            }
        }

        // Test automatico all'avvio
        window.addEventListener('load', function() {
            log('🚀 Avvio test automatico...');
            
            setTimeout(() => {
                testEcho();
            }, 500);
            
            setTimeout(() => {
                testReverbClient();
            }, 1000);
            
            setTimeout(() => {
                testWebRTC();
            }, 1500);
        });
    </script>
</body>
</html>
